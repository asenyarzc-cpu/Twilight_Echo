appId: com.TwilightEcho.music
productName: TwilightEcho
directories:
  buildResources: build
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
icon: build/icon.png
# Single after-pack hook that dispatches to platform-specific scripts
# (scripts/after-pack.cjs -> after-pack-windows.cjs / after-pack-linux.cjs).
# Keeps Windows (rcedit icon/version injection) and Linux (native libs)
# packaging fully isolated.
afterPack: scripts/after-pack.cjs
files:
  - out/**
  - package.json
  - THIRD-PARTY-NOTICES.txt
  - '!out/renderer/audio-engine/**'
  - '!out/renderer/plugins/**'
  - '!out/renderer/plugin-index/**'
  # Keep packaged Inter/Jakarta + MiSans subsets; strip legacy TTF/OTF/WOFF.
  - '!out/renderer/font/Alibaba-PuHuiTi-Medium.ttf'
  - '!out/renderer/font/Outfit-**'
  - '!out/renderer/font/**/*.{ttf,otf,woff}'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,example,examples,benchmark,benchmarks}/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/@neteasecloudmusicapienhanced/api/public/**'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/smtc
    to: smtc
    filter:
      - '**/*.ico'
  - from: resources/audio-engine
    to: audio-engine
    filter:
      - '**/*'
  - from: resources/plugins
    to: plugins
    filter:
      - '**/*'
  - from: resources/plugin-index
    to: plugin-index
    filter:
      - '**/*'
win:
  executableName: TwilightEcho
  icon: build/icon.ico
  # Personal-project Windows packages are intentionally unsigned. Release integrity is provided
  # by the generated SHA-256 companion file and the fail-closed artifact checks.
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  maintainer: mrcwoods
  category: Audio
  icon: build/icon.png
  executableName: music
  synopsis: Modern desktop music player
  description: >
    Twilight Echo is a modern desktop music player for local collections,
    streaming exploration, and HiFi playback.
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
