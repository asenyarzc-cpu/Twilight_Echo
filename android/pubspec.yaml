name: twilight_echo
description: "Twilight Echo - Android music client with custom source support."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  go_router: ^14.2.7
  cached_network_image: ^3.4.1
  flutter_audio_tagger: ^5.1.3

  crypto: ^3.0.6
  pointycastle: ^3.9.1
  html_unescape: ^2.0.0
  fast_gbk: ^1.0.0
  archive: ^4.0.2
  native_dio_adapter: 1.5.1
  flutter_slidable: ^4.0.3
  dynamic_color: ^1.8.1
  material_color_utilities: 0.13.0
  material_symbols_icons: ^4.2951.0
  material_new_shapes: ^1.0.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  toastification: ^3.2.0
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.7

flutter:
  uses-material-design: true
  assets:
    - icon.svg
    - icon.png
